name: Deploy brb-events

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t brb-events:latest \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            .
          docker images brb-events:latest

      - name: Deploy to EC2
        if: success()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          set -euo pipefail
          SSH_PORT="${EC2_SSH_PORT:-2222}"
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20"
          echo "Deploying to ${EC2_USER}@${EC2_HOST}:${SSH_PORT}"

          # Setup SSH
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          trap 'rm -f ~/.ssh/id_rsa brb-events.tar' EXIT

          if [ -n "${EC2_HOST_KEY:-}" ]; then
            echo "$EC2_HOST_KEY" > ~/.ssh/known_hosts
          else
            if ! ssh-keyscan -T 15 -p "$SSH_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts; then
              echo "::error::ssh-keyscan failed. Check EC2_HOST/EC2_SSH_PORT reachability or set EC2_HOST_KEY secret."
              exit 1
            fi
          fi

          ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa $SSH_OPTS $EC2_USER@$EC2_HOST "echo Connected to \$(hostname)"

          docker save brb-events:latest > brb-events.tar
          scp -P "$SSH_PORT" -i ~/.ssh/id_rsa $SSH_OPTS brb-events.tar $EC2_USER@$EC2_HOST:/tmp/

          ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa $SSH_OPTS $EC2_USER@$EC2_HOST bash -s << 'EOF'
          set -euo pipefail
          docker load < /tmp/brb-events.tar
          docker stop brb-events-prod || true
          docker rm brb-events-prod || true
          docker run -d \
            --name brb-events-prod \
            --restart unless-stopped \
            -p 127.0.0.1:3002:80 \
            brb-events:latest
          docker ps --filter name=brb-events-prod --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          docker inspect -f '{{.State.Running}}' brb-events-prod | grep true
          rm /tmp/brb-events.tar
          EOF

          rm -f brb-events.tar
